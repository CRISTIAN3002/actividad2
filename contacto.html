<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cafetería Cristian - Contacto</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="header-principal">
    <div class="logo">
      <h1>Cafetería Cristian</h1>
    </div>
    <nav class="nav-principal">
      <ul>
        <li><a href="index.html">Inicio</a></li>
        <li><a href="productos.html">Productos</a></li>
        <li><a href="contacto.html" class="activo">Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="seccion-contacto">
      <h2>Ponte en Contacto</h2>
      <p>Envíanos tus comentarios, sugerencias o dudas sobre nuestros servicios.</p>

      <form action="#" method="post" class="form-contacto">
        <div class="campo-form">
          <label for="nombre">Nombre completo:</label>
          <input type="text" id="nombre" name="nombre" required placeholder="Escribe tu nombre">
        </div>

        <div class="campo-form">
          <label for="correo">Correo electrónico:</label>
          <input type="email" id="correo" name="correo" required placeholder="ejemplo@correo.com">
        </div>

        <div class="campo-form">
          <label for="mensaje">Mensaje:</label>
          <textarea id="mensaje" name="mensaje" rows="5" required placeholder="Escribe tu mensaje aquí..."></textarea>
        </div>

        <button type="submit" class="btn">Enviar Mensaje</button>
      </form>
    </section>
  </main>

  <footer class="footer-principal">
    <p>&copy; 2026 Cafetería Cristian. Todos los derechos reservados.</p>
  </footer>

</body>
</html>
